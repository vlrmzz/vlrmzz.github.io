<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" width="1280" height="692" role="img" aria-label="A generative LLM writes its answer one piece at a time, feeding each piece back in, and the text then has to be parsed. A decision model takes the session and the options and returns one probability per option in a single run of the network.">
<title>A generative LLM writes its answer one piece at a time, feeding each piece back in, and the text then has to be parsed. A decision model takes the session and the options and returns one probability per option in a single run of the network.</title>
<style>
svg { --paper:#FBFAF7; --panel:#FFFFFF; --soft:#F2F1EC; --ink:#1A1C1A; --muted:#6B7069;
      --grid:#E4E2DA; --axis:#C9C6BB; --border:#D8D5CB; --accent:#1F5C46; --on-accent:#FFFFFF;
      --s1:#2E8B68; --s2:#C9622A; --s3:#3A6BC4; --context:#A3A89F; }
@media (prefers-color-scheme: dark) {
  svg { --paper:#131614; --panel:#181C19; --soft:#1B1F1C; --ink:#E9E8E2; --muted:#969C93;
        --grid:#272B27; --axis:#3D433D; --border:#343A35; --accent:#7FC8A3; --on-accent:#131614;
        --s1:#3FA27A; --s2:#D9703A; --s3:#5B8DEF; --context:#5F665F; }
}
text { font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
<rect x="0.0" y="0.0" width="640.0" height="346.0" style="fill:var(--paper)"/>
<text x="16.0" y="28.0" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--ink)">Two ways to get a decision out of a model</text>
<rect x="16.0" y="46.0" width="608.0" height="138.0" rx="8" style="fill:var(--paper);stroke:var(--border);stroke-width:1"/>
<text x="30.0" y="70.0" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">Generative LLM</text>
<text x="143.7" y="70.0" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--muted)">the network runs once for every piece of output</text>
<rect x="30.0" y="90.0" width="112.0" height="40.0" rx="7" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="86.0" y="114.5" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">session + prompt</text>
<line x1="142.0" y1="110.0" x2="155.0" y2="110.0" style="stroke:var(--muted);stroke-width:1.4"/>
<polygon points="162.0,110.0 155.0,106.4 155.0,113.6" style="fill:var(--muted)"/>
<rect x="164.0" y="90.0" width="60.0" height="40.0" rx="7" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<rect x="164.0" y="97.0" width="3.0" height="26.0" rx="1.5" style="fill:var(--accent)"/>
<text x="194.0" y="114.5" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">LLM</text>
<line x1="224.0" y1="110.0" x2="237.0" y2="110.0" style="stroke:var(--muted);stroke-width:1.4"/>
<polygon points="244.0,110.0 237.0,106.4 237.0,113.6" style="fill:var(--muted)"/>
<rect x="246.0" y="97.0" width="71.8" height="26.0" rx="5" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="281.9" y="114.5" class="mono" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--ink)">{&quot;type&quot;:</text>
<rect x="321.8" y="97.0" width="57.3" height="26.0" rx="5" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="350.5" y="114.5" class="mono" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--ink)">&quot;brute</text>
<rect x="383.1" y="97.0" width="64.6" height="26.0" rx="5" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="415.4" y="114.5" class="mono" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--ink)">_force&quot;</text>
<rect x="451.7" y="97.0" width="21.2" height="26.0" rx="5" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="462.3" y="114.5" class="mono" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--ink)">}</text>
<line x1="472.9" y1="110.0" x2="485.9" y2="110.0" style="stroke:var(--muted);stroke-width:1.4"/>
<polygon points="492.9,110.0 485.9,106.4 485.9,113.6" style="fill:var(--muted)"/>
<rect x="494.9" y="90.0" width="115.1" height="40.0" rx="7" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="552.5" y="114.5" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">parse the text</text>
<path d="M330,123 L330,152 L194,152 L194,138"  style="fill:none;stroke:var(--s2);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round"/>
<line x1="194.0" y1="140.0" x2="194.0" y2="138.0" style="stroke:var(--s2);stroke-width:1.4"/>
<polygon points="194.0,131.0 190.4,138.0 197.6,138.0" style="fill:var(--s2)"/>
<text x="340.0" y="156.0" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--muted)">each new piece is fed back in</text>
<rect x="16.0" y="198.0" width="608.0" height="132.0" rx="8" style="fill:var(--paper);stroke:var(--border);stroke-width:1"/>
<text x="30.0" y="222.0" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--ink)">Decision model</text>
<text x="143.7" y="222.0" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--muted)">the network runs once; nothing is written</text>
<rect x="30.0" y="258.0" width="112.0" height="40.0" rx="7" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="86.0" y="282.5" font-size="12.5" font-weight="600" text-anchor="middle" style="fill:var(--ink)">session + options</text>
<line x1="142.0" y1="278.0" x2="155.0" y2="278.0" style="stroke:var(--muted);stroke-width:1.4"/>
<polygon points="162.0,278.0 155.0,274.4 155.0,281.6" style="fill:var(--muted)"/>
<rect x="164.0" y="258.0" width="116.0" height="40.0" rx="7" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<rect x="164.0" y="265.0" width="3.0" height="26.0" rx="1.5" style="fill:var(--accent)"/>
<text x="222.0" y="282.5" font-size="13" font-weight="600" text-anchor="middle" style="fill:var(--ink)">the model</text>
<line x1="280.0" y1="278.0" x2="293.0" y2="278.0" style="stroke:var(--muted);stroke-width:1.4"/>
<polygon points="300.0,278.0 293.0,274.4 293.0,281.6" style="fill:var(--muted)"/>
<text x="312.0" y="246.0" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--muted)">one probability per option</text>
<text x="312.0" y="267.0" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--ink)">brute_force</text>
<rect x="446.0" y="257.0" width="124.0" height="12.0" rx="3" style="fill:var(--grid)"/>
<path d="M446.0,257.0 L520.6,257.0 Q524.1,257.0 524.1,260.5 L524.1,265.5 Q524.1,269.0 520.6,269.0 L446.0,269.0 Z" style="fill:var(--s1)"/>
<text x="578.0" y="267.5" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--ink)">0.63</text>
<text x="312.0" y="289.0" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--ink)">credential_stuffing</text>
<rect x="446.0" y="279.0" width="124.0" height="12.0" rx="3" style="fill:var(--grid)"/>
<path d="M446.0,279.0 L484.7,279.0 Q488.2,279.0 488.2,282.5 L488.2,287.5 Q488.2,291.0 484.7,291.0 L446.0,291.0 Z" style="fill:var(--s1)"/>
<text x="578.0" y="289.5" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--ink)">0.34</text>
<text x="312.0" y="311.0" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--ink)">benign</text>
<rect x="446.0" y="301.0" width="124.0" height="12.0" rx="3" style="fill:var(--grid)"/>
<path d="M446.0,301.0 L446.0,301.0 Q448.5,301.0 448.5,303.5 L448.5,310.5 Q448.5,313.0 446.0,313.0 L446.0,313.0 Z" style="fill:var(--s1)"/>
<text x="578.0" y="311.5" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--ink)">0.02</text>
</svg>
