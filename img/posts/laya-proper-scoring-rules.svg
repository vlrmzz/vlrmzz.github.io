<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="1320" height="630" role="img" aria-label="Three small charts of expected reward against reported probability when the true probability is 70 percent. An accuracy-style reward peaks at reporting 100 percent; the log score and the spherical score both peak at 70 percent.">
<title>Three small charts of expected reward against reported probability when the true probability is 70 percent. An accuracy-style reward peaks at reporting 100 percent; the log score and the spherical score both peak at 70 percent.</title>
<rect x="0.0" y="0.0" width="880.0" height="420.0" fill="#232427" rx="10"/>
<text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="18" fill="#ffffff" font-weight="600" text-anchor="start">Which reward makes honesty the best policy?</text>
<text x="28.0" y="61.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">The event is truly 70% likely. Each curve is the average reward for reporting a probability q instead.</text>
<text x="28.0" y="402.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Computed from the definitions. Accuracy reward: q if right, 1 − q if wrong. Log and spherical are strictly proper scoring rules.</text>
