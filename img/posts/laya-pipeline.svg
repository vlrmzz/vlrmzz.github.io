<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" width="1320" height="702" role="img" aria-label="Pipeline diagram: a request passes a language check, then a decision model answers a guardrail question, a routing question and a triage question in one pass. A confidence gate sends confident answers to automatic action, unsure ones to a frontier LLM or a human, and guardrail hits to a block.">
<title>Pipeline diagram: a request passes a language check, then a decision model answers a guardrail question, a routing question and a triage question in one pass. A confidence gate sends confident answers to automatic action, unsure ones to a frontier LLM or a human, and guardrail hits to a block.</title>
<rect x="0.0" y="0.0" width="880.0" height="468.0" fill="#232427" rx="10"/>
<text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="18" fill="#ffffff" font-weight="600" text-anchor="start">Where a decision model sits in an LLM pipeline</text>
<text x="28.0" y="61.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">It answers the cheap, frequent questions first, so the expensive model only sees what needs it.</text>
<text x="28.0" y="450.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Schematic of a typical placement. The threshold is a policy you fit on your own held-out data.</text>
<rect x="28.0" y="194.0" width="100.0" height="60.0" fill="#2c2f36" rx="8" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="78.0" y="221.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14" fill="#ffffff" font-weight="600" text-anchor="middle">Request</text>
<text x="78.0" y="240.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="middle">ticket, prompt</text>
<line x1="128.0" y1="224.0" x2="142.0" y2="224.0" stroke="#898781" stroke-width="1.5"/>
<polygon points="150.0,224.0 142.0,220.0 142.0,228.0" fill="#898781"/>
<rect x="152.0" y="194.0" width="118.0" height="60.0" fill="#2c2f36" rx="8" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="211.0" y="221.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" fill="#ffffff" font-weight="600" text-anchor="middle">Language check</text>
<text x="211.0" y="240.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="middle">picks checkpoint</text>
<line x1="270.0" y1="224.0" x2="284.0" y2="224.0" stroke="#898781" stroke-width="1.5"/>
<polygon points="292.0,224.0 284.0,220.0 284.0,228.0" fill="#898781"/>
<rect x="294.0" y="96.0" width="228.0" height="256.0" fill="#2c2f36" rx="10" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<rect x="294.0" y="106.0" width="3.0" height="236.0" fill="#3987e5" rx="1.5"/>
<text x="312.0" y="124.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="15" fill="#ffffff" font-weight="600" text-anchor="start">Decision model</text>
<text x="312.0" y="143.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="start">all questions in one forward pass</text>
<rect x="310.0" y="160.0" width="196.0" height="52.0" fill="#232427" rx="6" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="322.0" y="181.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Guardrail</text>
<rect x="440.5" y="168.0" width="53.5" height="19.0" fill="none" rx="4" stroke="#4b4d54" stroke-width="1"/>
<text x="467.2" y="181.5" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">yes/no</text>
<text x="322.0" y="200.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">Is it a prompt injection?</text>
<rect x="310.0" y="222.0" width="196.0" height="52.0" fill="#232427" rx="6" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="322.0" y="243.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Routing</text>
<rect x="440.5" y="230.0" width="53.5" height="19.0" fill="none" rx="4" stroke="#4b4d54" stroke-width="1"/>
<text x="467.2" y="243.5" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">choice</text>
<text x="322.0" y="262.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">Which team handles it?</text>
<rect x="310.0" y="284.0" width="196.0" height="52.0" fill="#232427" rx="6" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="322.0" y="305.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="start">Triage</text>
<rect x="447.4" y="292.0" width="46.6" height="19.0" fill="none" rx="4" stroke="#4b4d54" stroke-width="1"/>
<text x="470.7" y="305.5" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">score</text>
<text x="322.0" y="324.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="start">How urgent is it, 0 to 3?</text>
<line x1="522.0" y1="224.0" x2="536.0" y2="224.0" stroke="#898781" stroke-width="1.5"/>
<polygon points="544.0,224.0 536.0,220.0 536.0,228.0" fill="#898781"/>
<rect x="546.0" y="194.0" width="122.0" height="60.0" fill="#2c2f36" rx="8" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<rect x="546.0" y="202.0" width="3.0" height="44.0" fill="#d95926" rx="1.5"/>
<text x="607.0" y="221.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Confidence</text>
<text x="607.0" y="240.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="middle">above threshold?</text>
<rect x="708.0" y="102.0" width="144.0" height="60.0" fill="#2c2f36" rx="8" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="780.0" y="129.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Block or flag</text>
<text x="780.0" y="148.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="middle">guardrail fired</text>
<rect x="708.0" y="194.0" width="144.0" height="60.0" fill="#2c2f36" rx="8" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="780.0" y="221.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Act automatically</text>
<text x="780.0" y="240.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="middle">queue, tool, small LLM</text>
<rect x="708.0" y="286.0" width="144.0" height="60.0" fill="#2c2f36" rx="8" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
<text x="780.0" y="313.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#ffffff" font-weight="600" text-anchor="middle">Escalate</text>
<text x="780.0" y="332.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#c3c2b7" font-weight="400" text-anchor="middle">frontier LLM or human</text>
<line x1="668.0" y1="224.0" x2="682.0" y2="224.0" stroke="#898781" stroke-width="1.5"/>
<line x1="682.0" y1="132.0" x2="682.0" y2="316.0" stroke="#898781" stroke-width="1.5"/>
<line x1="682.0" y1="132.0" x2="698.0" y2="132.0" stroke="#898781" stroke-width="1.5"/>
<polygon points="706.0,132.0 698.0,128.0 698.0,136.0" fill="#898781"/>
<line x1="682.0" y1="224.0" x2="698.0" y2="224.0" stroke="#898781" stroke-width="1.5"/>
<polygon points="706.0,224.0 698.0,220.0 698.0,228.0" fill="#898781"/>
<line x1="682.0" y1="316.0" x2="698.0" y2="316.0" stroke="#898781" stroke-width="1.5"/>
<polygon points="706.0,316.0 698.0,312.0 698.0,320.0" fill="#898781"/>
<text x="676.0" y="184.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="end">confident</text>
<text x="676.0" y="272.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" fill="#c3c2b7" font-weight="400" text-anchor="end">unsure</text>
<rect x="28.0" y="382.0" width="824.0" height="38.0" fill="none" rx="8" stroke="#4b4d54" stroke-width="1"/>
<text x="440.0" y="406.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="12.5" fill="#c3c2b7" font-weight="400" text-anchor="middle">Log every decision with its probabilities, compare against outcomes, and refit the threshold as traffic changes.</text>
</svg>
