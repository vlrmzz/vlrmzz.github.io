<text x="143.1" y="83.5" class="mono" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--ink)">login_ok</text>
<rect x="184.0" y="66.0" width="71.8" height="26.0" rx="5" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="219.9" y="83.5" class="mono" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--ink)">http_200</text>
<rect x="260.8" y="66.0" width="86.2" height="26.0" rx="5" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="303.9" y="83.5" class="mono" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--ink)">login_fail</text>
<rect x="352.1" y="66.0" width="79.0" height="26.0" rx="5" style="fill:var(--panel);stroke:var(--border);stroke-width:1"/>
<text x="391.6" y="83.5" class="mono" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--ink)">dns_query</text>
<text x="16.0" y="122.0" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--muted)">the true probability of each option, computed from the model that generated the events</text>
