<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="1320" height="705" role="img" aria-label="Grouped column chart of gate precision at confidence thresholds 0.50, 0.70, 0.85 and 0.95. With 3 options precision is 9 of 10, 7 of 7 and 3 of 3. With 20 options it is 7 of 12, 6 of 11, 5 of 9 and 5 of 7.">
