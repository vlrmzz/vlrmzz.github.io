<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 772" width="1320" height="1158" role="img" aria-label="Architecture diagram: the input sequence holds the question, one [MASK] token per option, and the text. It passes through a ModernBERT-large encoder and a two-layer decision head. The hidden state at each [MASK] is scored by an MLP into one logit per option, and a temperature-scaled softmax turns the logits into probabilities.">
<title>Architecture diagram: the input sequence holds the question, one [MASK] token per option, and the text. It passes through a ModernBERT-large encoder and a two-layer decision head. The hidden state at each [MASK] is scored by an MLP into one logit per option, and a temperature-scaled softmax turns the logits into probabilities.</title>
<rect x="0.0" y="0.0" width="880.0" height="772.0" fill="#232427" rx="10"/>
<text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="18" fill="#ffffff" font-weight="600" text-anchor="start">Inside the decision model</text>
<text x="28.0" y="61.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">Each option gets its own [MASK] slot; the model&#x27;s output at that slot becomes the option&#x27;s score.</text>
<text x="28.0" y="754.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Based on build_sequence and DecisionModel in laya/common.py. Parameter counts from the repo&#x27;s T4 benchmark file. Logits illustrative.</text>
<text x="28.0" y="92.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13" fill="#3987e5" font-weight="600" text-anchor="start">1</text>
