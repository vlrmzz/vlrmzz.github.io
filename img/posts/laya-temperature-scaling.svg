<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 404" width="1320" height="606" role="img" aria-label="Three bar charts of the same five option logits at temperatures 0.5, 1 and 2. The top option&#x27;s probability falls from 0.78 to 0.52 to 0.35 as temperature rises, while the order of the options stays the same.">
<title>Three bar charts of the same five option logits at temperatures 0.5, 1 and 2. The top option&#x27;s probability falls from 0.78 to 0.52 to 0.35 as temperature rises, while the order of the options stays the same.</title>
<rect x="0.0" y="0.0" width="880.0" height="404.0" fill="#232427" rx="10"/>
<text x="28.0" y="38.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="18" fill="#ffffff" font-weight="600" text-anchor="start">Temperature changes how sure the model sounds, not what it picks</text>
<text x="28.0" y="61.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="13.5" fill="#c3c2b7" font-weight="400" text-anchor="start">The same five logits pushed through softmax(z / T) at three temperatures. The ranking never changes.</text>
<text x="28.0" y="386.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="11.5" fill="#898781" font-weight="400" text-anchor="start">Illustrative logits (2.0, 1.2, 0.6, 0.0, −0.5). T below 1 sharpens the distribution; T above 1 flattens it.</text>
<text x="52.0" y="98.0" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' font-size="14.5" fill="#ffffff" font-weight="600" text-anchor="start">T = 0.5</text>
