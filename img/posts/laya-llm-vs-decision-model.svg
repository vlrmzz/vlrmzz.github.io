<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="1320" height="678" role="img" aria-label="Schematic comparing a generative LLM, which emits a JSON answer token by token and then has to be parsed, with a decision model, which returns one probability per option in a single forward pass.">
<title>Schematic comparing a generative LLM, which emits a JSON answer token by token and then has to be parsed, with a decision model, which returns one probability per option in a single forward pass.</title>
