<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 604" width="1280" height="1208" role="img" aria-label="The input sequence holds the question, one MASK token per option, and the session. It passes through a ModernBERT-large encoder and a two-layer decision head. The output at each MASK position is scored into one raw score per option, and a softmax with temperature T turns the scores into probabilities.">
<title>The input sequence holds the question, one MASK token per option, and the session. It passes through a ModernBERT-large encoder and a two-layer decision head. The output at each MASK position is scored into one raw score per option, and a softmax with temperature T turns the scores into probabilities.</title>
